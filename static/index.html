<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歌单导入器</title>
  <link rel="icon" href="icon.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部装饰 -->
    <div class="ambient-glow"></div>

    <!-- 头部 -->
    <header class="header">
      <div class="logo-row">
        <div class="logo-wrap">
          <img src="icon.jpg" class="logo" alt="logo">
        </div>
        <div class="title-wrap">
          <h1>歌单<span class="accent">导入器</span></h1>
          <p class="subtitle">识别音乐平台分享歌单，导入至 Songloft</p>
        </div>
      </div>
    </header>

    <!-- 标签导航 -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="import">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        <span>导入歌单</span>
      </button>
      <button class="tab-btn" data-tab="settings">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>设置</span>
      </button>
    </nav>

    <!-- ========== 导入歌单面板 ========== -->
    <section id="tab-import" class="tab-content active">
      <!-- 输入区 -->
      <div class="card input-card">
        <div class="card-header">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
          </span>
          <span class="card-title">粘贴分享链接</span>
        </div>
        <textarea id="share-input" class="textarea" rows="3"
          placeholder="粘贴来自网易云音乐、QQ音乐、酷我、酷狗、汽水音乐的分享链接或文字..."></textarea>
        <div class="platform-hint">
          <span class="hint-dot"></span>
          <span>支持直接粘贴 App 分享文字，自动识别链接</span>
        </div>
        <div class="button-row">
          <button id="btn-preview" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>预览歌单</span>
          </button>
          <button id="btn-import" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            <span>开始导入</span>
          </button>
        </div>
      </div>

      <!-- 预览结果 -->
      <div id="preview-section" class="card hidden">
        <div class="card-header">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </span>
          <span class="card-title">歌单预览</span>
        </div>
        <div id="preview-info" class="preview-info"></div>
        <div id="preview-tracks" class="track-list"></div>
      </div>

      <!-- 导入进度 -->
      <div id="progress-section" class="card hidden">
        <div class="card-header">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
          </span>
          <span class="card-title">导入进度</span>
        </div>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <div class="progress-stats">
          <span id="progress-text">准备中...</span>
          <span id="progress-count"></span>
        </div>
        <div id="progress-current" class="progress-current"></div>
        <div id="progress-errors" class="error-list hidden"></div>
      </div>
    </section>

    <!-- ========== 设置面板 ========== -->
    <section id="tab-settings" class="tab-content">
      <!-- 洛雪音源设置 -->
      <div class="card">
        <div class="card-header">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
          </span>
          <span class="card-title">洛雪音源设置</span>
        </div>

        <div class="form-group">
          <label class="label" for="cfg-url">音源 API 服务器地址</label>
          <input type="text" id="cfg-url" class="input"
            placeholder="http://192.168.1.100:8080">
          <p class="hint">部署 lx-source 或 lx-music-api-server 的服务器地址</p>
        </div>

        <div class="form-group">
          <label class="label" for="cfg-pass">API 密钥（可选）</label>
          <input type="password" id="cfg-pass" class="input" placeholder="留空表示不需要">
        </div>

        <div class="button-row">
          <button id="btn-test" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
            <span>测试连接</span>
          </button>
          <button id="btn-save-config" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
            <span>保存设置</span>
          </button>
        </div>
        <div id="test-result" class="test-result hidden"></div>
      </div>

      <!-- 导入选项 -->
      <div class="card">
        <div class="card-header">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          </span>
          <span class="card-title">导入选项</span>
        </div>

        <div class="form-group">
          <label class="label" for="cfg-mode">导入模式</label>
          <select id="cfg-mode" class="select">
            <option value="download">下载模式 — 下载音乐文件到本地</option>
            <option value="stream">串流模式 — 以远程歌曲形式导入</option>
          </select>
        </div>

        <div class="form-group">
          <label class="label" for="cfg-quality">默认音质</label>
          <select id="cfg-quality" class="select">
            <option value="128k">128kbps（标准）</option>
            <option value="320k">320kbps（高质量）</option>
            <option value="flac">FLAC（无损）</option>
            <option value="flac24bit">FLAC 24bit（Hi-Res）</option>
          </select>
        </div>

        <div class="form-group">
          <label class="label" for="cfg-source">默认搜索来源（跨平台匹配时使用）</label>
          <select id="cfg-source" class="select">
            <option value="kw">酷我音乐</option>
            <option value="kg">酷狗音乐</option>
            <option value="tx">QQ音乐</option>
            <option value="wy">网易云音乐</option>
            <option value="mg">咪咕音乐</option>
          </select>
          <p class="hint">当歌单平台与洛雪音源平台不一致时，在此平台搜索匹配歌曲</p>
        </div>

        <button id="btn-save-options" class="btn btn-primary btn-block">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
          <span>保存选项</span>
        </button>
      </div>

      <!-- 支持的平台 -->
      <div class="card">
        <div class="card-header">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><path d="M8 21h8M12 17v4"/></svg>
          </span>
          <span class="card-title">支持的平台</span>
        </div>
        <div id="platform-list" class="platform-list"></div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
