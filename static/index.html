<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌單匯入器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>歌單匯入器</h1>
      <p class="subtitle">識別音樂平台分享歌單，匯入至 Songloft 或通過洛雪音源下載</p>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="import">匯入歌單</button>
      <button class="tab-btn" data-tab="settings">設定</button>
    </nav>

    <!-- 匯入歌單面板 -->
    <section id="tab-import" class="tab-content active">
      <div class="card">
        <label class="label">貼上分享連結或文字</label>
        <textarea id="share-input" class="textarea" rows="4"
          placeholder="貼上來自網易雲、QQ音樂、酷我、酷狗的分享連結或文字...&#10;例如：https://y.music.163.com/m/playlist?id=123456"></textarea>

        <div class="button-row">
          <button id="btn-preview" class="btn btn-secondary">預覽歌單</button>
          <button id="btn-import" class="btn btn-primary">開始匯入</button>
        </div>
      </div>

      <!-- 預覽結果 -->
      <div id="preview-section" class="card hidden">
        <h2 class="card-title">歌單預覽</h2>
        <div id="preview-info" class="preview-info"></div>
        <div id="preview-tracks" class="track-list"></div>
      </div>

      <!-- 匯入進度 -->
      <div id="progress-section" class="card hidden">
        <h2 class="card-title">匯入進度</h2>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <div class="progress-stats">
          <span id="progress-text">準備中...</span>
          <span id="progress-count"></span>
        </div>
        <div id="progress-current" class="progress-current"></div>
        <div id="progress-errors" class="error-list hidden"></div>
      </div>
    </section>

    <!-- 設定面板 -->
    <section id="tab-settings" class="tab-content">
      <div class="card">
        <h2 class="card-title">洛雪音源設定</h2>

        <div class="form-group">
          <label class="label" for="cfg-url">音源 API 伺服器位址</label>
          <input type="text" id="cfg-url" class="input"
            placeholder="http://192.168.1.100:8080">
          <p class="hint">部署 lx-source 或 lx-music-api-server 的伺服器位址</p>
        </div>

        <div class="form-group">
          <label class="label" for="cfg-pass">API 密鑰（可選）</label>
          <input type="password" id="cfg-pass" class="input" placeholder="留空表示不需要">
        </div>

        <div class="button-row">
          <button id="btn-test" class="btn btn-secondary">測試連接</button>
          <button id="btn-save-config" class="btn btn-primary">儲存設定</button>
        </div>
        <div id="test-result" class="test-result hidden"></div>
      </div>

      <div class="card">
        <h2 class="card-title">匯入選項</h2>

        <div class="form-group">
          <label class="label" for="cfg-mode">匯入模式</label>
          <select id="cfg-mode" class="select">
            <option value="download">下載模式 — 下載音樂檔案到本地</option>
            <option value="stream">串流模式 — 以遠端歌曲形式匯入</option>
          </select>
        </div>

        <div class="form-group">
          <label class="label" for="cfg-quality">預設音質</label>
          <select id="cfg-quality" class="select">
            <option value="128k">128kbps (標準)</option>
            <option value="320k">320kbps (高品質)</option>
            <option value="flac">FLAC (無損)</option>
            <option value="flac24bit">FLAC 24bit (Hi-Res)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="label" for="cfg-source">預設搜尋來源（跨平台匹配時使用）</label>
          <select id="cfg-source" class="select">
            <option value="kw">酷我音樂</option>
            <option value="kg">酷狗音樂</option>
            <option value="tx">QQ音樂</option>
            <option value="wy">網易雲音樂</option>
            <option value="mg">咪咕音樂</option>
          </select>
          <p class="hint">當歌單平台與洛雪音源平台不一致時，在此平台搜尋匹配歌曲</p>
        </div>

        <button id="btn-save-options" class="btn btn-primary">儲存選項</button>
      </div>

      <div class="card">
        <h2 class="card-title">支援的平台</h2>
        <div id="platform-list" class="platform-list"></div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
